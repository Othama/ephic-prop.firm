<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPHIC PROP FIRM - Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',sans-serif;background:#0b0e11;color:#fff;min-height:100vh;padding:20px}
        .container{width:100%;max-width:600px;margin:auto}
        .card{background:linear-gradient(145deg,#12122a,#1a1a3e);border-radius:24px;padding:32px;border:1px solid rgba(255,255,255,0.06);box-shadow:0 25px 80px rgba(0,0,0,0.8);margin-bottom:16px}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
        .header h1{color:#f0b90b;font-size:20px}
        .header .logout{color:#ff4444;cursor:pointer;font-size:13px}
        .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
        .stat{background:rgba(255,255,255,0.04);padding:14px;border-radius:12px;text-align:center}
        .stat .number{font-size:22px;font-weight:700;color:#f0b90b}
        .stat .label{font-size:10px;color:#8899bb;text-transform:uppercase;margin-top:2px}
        .balance-box{background:rgba(255,255,255,0.04);padding:20px;border-radius:16px;text-align:center;margin:16px 0}
        .balance-box .amount{font-size:34px;font-weight:800;color:#4caf50}
        .balance-box .label{color:#8899bb;font-size:13px}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,#f0b90b,#f9a13a);border:none;border-radius:12px;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;margin-top:8px}
        .btn:hover{transform:translateY(-2px)}
        .btn-secondary{background:rgba(255,255,255,0.06);color:#fff}
        .btn-secondary:hover{background:rgba(255,255,255,0.1)}
        .trade-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
        .trade-item .pair{color:#e0e0e0}
        .trade-item .profit{color:#4caf50}
        .trade-item .loss{color:#ff4444}
        .challenge-item{background:rgba(255,255,255,0.04);padding:12px;border-radius:10px;margin:8px 0;border:1px solid rgba(255,255,255,0.04)}
        .challenge-item .status-active{color:#4caf50}
        .challenge-item .status-completed{color:#f0b90b}
        .challenge-item .status-failed{color:#ff4444}
        .footer{text-align:center;margin-top:16px;color:#445566;font-size:11px}
        .username-display{color:#8899bb;font-size:14px;margin-bottom:8px}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">
            <h1>📊 Dashboard</h1>
            <span class="logout" onclick="logout()">Logout</span>
        </div>

        <div class="username-display" id="usernameDisplay">👤 Loading...</div>

        <div class="stats">
            <div class="stat"><div class="number" id="balance">$0</div><div class="label">Balance</div></div>
            <div class="stat"><div class="number" id="equity">$0</div><div class="label">Equity</div></div>
            <div class="stat"><div class="number" id="drawdown">0%</div><div class="label">Drawdown</div></div>
        </div>

        <div class="balance-box">
            <div class="label">💰 Available Balance</div>
            <div class="amount" id="availBalance">$0.00</div>
        </div>

        <button class="btn" onclick="buyNewChallenge()">🚀 Buy Challenge</button>
        <button class="btn btn-secondary" onclick="requestPayout()">💰 Request Payout</button>

        <div style="margin-top:16px">
            <h3 style="color:#8899bb;font-size:14px;margin-bottom:8px">📈 My Challenges</h3>
            <div id="challengeList">
                <div style="color:#445566;font-size:13px;text-align:center;padding:16px 0">No challenges yet. Buy one!</div>
            </div>
        </div>
    </div>
    <div class="footer">© 2026 EPHIC PROP FIRM • Dashboard v1.0</div>
</div>
<script>
let currentUser = null;

async function loadUser() {
    const username = localStorage.getItem('ephic_user');
    if (!username) {
        window.location.href = '/';
        return;
    }
    
    try {
        const res = await fetch(`/api/user/${username}`);
        const data = await res.json();
        if (data.status === 'success') {
            currentUser = data.user;
            document.getElementById('usernameDisplay').textContent = '👤 ' + username;
            updateDashboard(currentUser);
        } else {
            localStorage.removeItem('ephic_user');
            window.location.href = '/';
        }
    } catch(e) {
        console.log('Error loading user:', e);
    }
}

function updateDashboard(user) {
    const balance = user.balance || 0;
    const equity = user.equity || balance;
    const drawdown = user.drawdown || 0;
    
    document.getElementById('balance').textContent = '$' + balance;
    document.getElementById('equity').textContent = '$' + equity;
    document.getElementById('drawdown').textContent = drawdown + '%';
    document.getElementById('availBalance').textContent = '$' + equity.toFixed(2);
    
    if (user.challenges && user.challenges.length > 0) {
        const list = document.getElementById('challengeList');
        list.innerHTML = user.challenges.map(c => `
            <div class="challenge-item">
                <div style="display:flex;justify-content:space-between">
                    <span>💰 $${c.amount}</span>
                    <span class="status-${c.status}">${c.status.toUpperCase()}</span>
                </div>
                <div style="font-size:12px;color:#8899bb;margin-top:4px">
                    Balance: $${c.balance} | Equity: $${c.equity} | Drawdown: ${c.drawdown}%
                </div>
                <div style="font-size:11px;color:#445566;margin-top:2px">${new Date(c.date).toLocaleDateString()}</div>
            </div>
        `).join('');
    }
}

function logout() {
    localStorage.removeItem('ephic_user');
    window.location.href = '/';
}

function buyNewChallenge() {
    const amount = prompt('Select challenge size:\n1. $10,000 - $99\n2. $25,000 - $199\n3. $50,000 - $299\n\nEnter 1, 2, or 3:');
    const sizes = { '1': '10000', '2': '25000', '3': '50000' };
    const selected = sizes[amount];
    if (!selected) return;
    
    fetch('/api/buy', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ username: currentUser.username, amount: selected })
    })
    .then(r => r.json())
    .then(data => {
        if (data.status === 'success') {
            alert('✅ Challenge purchased!');
            loadUser();
        } else {
            alert('❌ ' + data.message);
        }
    });
}

function requestPayout() {
    alert('💰 Payout request submitted! Processing time: 24-48 hours.');
}

loadUser();
</script>
</body>
</html>
